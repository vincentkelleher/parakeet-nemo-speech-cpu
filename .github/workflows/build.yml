name: build-and-publish

# amd64 only, on purpose: what this image installs is
# nemo-speech-<ver>-linux-x86_64-cpu.tar.gz. There is no arm64 build of the runtime, so
# a multi-platform matrix would fail at the download step rather than the manifest step.
# On Apple Silicon that is the same reason the README says to pass
# --platform=linux/amd64 when building locally.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:

permissions:
  contents: read
  # The workflow's own token, and no personal access token anywhere: the image is pushed
  # to this repository's own GHCR namespace, which `packages: write` covers. The package
  # inherits the repository's visibility, so on a public repo it pulls anonymously.
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Tagging decided here rather than with metadata-action so the rule reads as one
      # sentence: a version tag publishes <version> and moves :latest, a merge to main
      # publishes :edge, a pull request builds and tests and publishes nothing.
      #
      # `primary` is the one tag the build loads and the smoke test runs; `extra` is a
      # space-separated list retagged and pushed afterwards. Emitted as separate keys
      # because $GITHUB_OUTPUT is last-value-wins on a repeated key — the first version of
      # this step wrote `tags=` twice for a version tag and silently published only
      # :latest, which the smoke test then caught by failing on a missing :0.2.0.
      - name: Decide what to publish
        id: tags
        run: |
          set -eu
          version=""
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
          esac
          if [ -n "$version" ]; then
            primary="${IMAGE}:${version}"; extra="${IMAGE}:latest"; push=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            primary="${IMAGE}:edge"; extra=""; push=true
          else
            primary="${IMAGE}:ci"; extra=""; push=false
          fi
          { echo "primary=$primary"; echo "extra=$extra"; echo "push=$push"; } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded, never pushed from here: publishing happens after the smoke
      # test, so a broken image cannot be the one :latest points at. With a single tag,
      # load also means the next step is inspecting the bytes that will be published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.tags.outputs.primary }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Nothing is pinned here that the Dockerfile does not already pin; this is the
          # version the archive checksum belongs to. If the two ever disagree the build
          # fails at the sha256 step, which is the whole point of the checksum.
          build-args: |
            NEMO_SPEECH_VERSION=0.2.0

      - name: Smoke test the image
        run: |
          set -eu
          image="${{ steps.tags.outputs.primary }}"
          docker image inspect "$image" >/dev/null
          docker run --rm --entrypoint /opt/nemo-speech/bin/nemo-speech "$image" --version
          docker run --rm --entrypoint /opt/nemo-speech/bin/nemo-speech "$image" doctor
          # The suite the README tells people to run — run here rather than promised. It
          # needs ffmpeg for two cases, and this image has it, which is precisely why the
          # tests belong in the image and not on the runner: the failure mode that shipped
          # once (a bundled libstdc++ shadowing the system one, killing ffmpeg) is only
          # visible inside it.
          docker run --rm -v "$GITHUB_WORKSPACE:/t:ro" --entrypoint python3 \
            "$image" -m unittest discover -s /t -p "test_*.py"

      # Plain `docker push` of images that already exist locally, after they passed:
      # layers are reused, each tag fails on its own line, and nothing is published that
      # the step above did not run.
      - name: Publish
        if: steps.tags.outputs.push == 'true'
        run: |
          set -eu
          primary="${{ steps.tags.outputs.primary }}"
          docker push "$primary"
          for tag in ${{ steps.tags.outputs.extra }}; do
            docker tag "$primary" "$tag"
            docker push "$tag"
          done
          echo "published: $primary ${{ steps.tags.outputs.extra }}"
